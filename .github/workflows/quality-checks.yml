name: unit-test

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "20.x"
        type: string
      build-command:
        description: "Build command to run"
        required: false
        default: "npx turbo build"
        type: string
      lint-command:
        description: "Lint command to run"
        required: false
        default: "npx turbo lint"
        type: string
      test-command:
        description: "Test command to run"
        required: false
        default: "npx turbo test"
        type: string
      working-directory:
        description: "Working directory for the project"
        required: false
        default: "."
        type: string
    outputs:
      test-result:
        description: "Result of the test execution"
        value: ${{ jobs.test.outputs.result }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Generate cache key
        id: cache-key
        run: echo "value=${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.cache-key.outputs.value }}

  build:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      result: ${{ steps.build.outcome }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run build
        id: build
        run: ${{ inputs.build-command }}
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      result: ${{ steps.lint.outcome }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run lint
        id: lint
        run: ${{ inputs.lint-command }}
        env:
          CI: true

  test:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      result: ${{ steps.test.outcome }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run tests
        id: test
        run: ${{ inputs.test-command }}
        env:
          CI: true
